<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recipe reading · Coffee Lab design</title>
  <link rel="stylesheet" href="../assets/recipe-reading.css?v=grind-preparation-1">
  <script type="module" src="../assets/recipe-reading.mjs?v=grind-preparation-1"></script>
</head>
<body>
  <main>
    <section id="setup" aria-labelledby="setup-title">
      <header class="home-header"><button id="open-settings" class="icon-button" aria-label="Settings" aria-controls="configuration">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9.5 3-.7 2.4-2 .9L4.5 6l-2 3.5 1.6 1.8v2l-1.6 1.8 2 3.5 2.3-.3 2 .9.7 2.3h4.1l.7-2.3 2-.9 2.3.3 2-3.5-1.6-1.8v-2l1.6-1.8-2-3.5-2.3.3-2-.9L13.7 3Z"/><circle cx="11.6" cy="12.2" r="3.3"/></svg>
      </button></header>
      <div class="home-identity">
        <img class="home-logo" src="../assets/coffee-lab-filter-concept.png" alt="" width="80" height="80">
        <h1 id="setup-title">Coffee Lab</h1>
      </div>
      <p class="eyebrow" id="demo">From your recipe journal</p>
      <p id="intro">Choose a recipe to begin.</p>
      <div class="recipe-choice">
        <span id="method-label" class="field-label">Recipe</span>
        <input type="hidden" id="method" value="hoffmann-stardust">
        <details id="recipe-picker">
          <summary aria-labelledby="method-label selected-recipe"><span id="selected-recipe">Hoffmann · Stardust</span><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg></summary>
          <div id="recipe-options" class="recipe-options" aria-labelledby="method-label"></div>
        </details>
      </div>
      <button id="start" class="reading-action">Read recipe <span aria-hidden="true">→</span></button>
    </section>
    <section id="configuration" hidden aria-labelledby="settings-title">
      <header><button id="close-settings">← <span id="settings-back">Back</span></button></header>
      <h1 id="settings-title">Settings</h1>
      <div class="settings">
        <label><span id="language-label">Language</span><select id="language"><option value="en">English</option><option value="pt-BR">Português (Brasil)</option></select></label>
        <label><span id="weight-label">Weight</span><select id="weight"><option value="g">g</option><option value="oz">oz</option></select></label>
        <label><span id="temperature-label">Temperature</span><select id="temperature"><option value="C">°C</option><option value="F">°F</option></select></label>
        <label class="toggle-setting"><span id="wake-label">Keep screen awake while reading</span><input id="wake-enabled" type="checkbox" role="switch" checked></label>
      </div>
    </section>
    <section id="reader" hidden aria-labelledby="recipe-title">
      <header><button id="exit">← <span id="exit-label">Recipes</span></button></header>
      <h1 id="recipe-title"></h1>
      <p id="recipe-context" class="recipe-context"></p>
      <div id="quantities" class="quantities"></div>
      <section id="preparation" aria-labelledby="preparation-title"><h2 id="preparation-title">Preparation</h2><ul id="preparation-notes"></ul></section>
      <section id="instruction" tabindex="-1" aria-label="Brewing schedule">
        <table class="brew-schedule"><thead><tr><th id="time-label" scope="col">Time</th><th id="action-label" scope="col">Action</th><th id="water-label" scope="col">Water</th></tr></thead><tbody id="schedule"></tbody></table>
        <p id="technique-note" class="technique-note"></p>
      </section>
    </section>
    <noscript>This design prototype needs JavaScript to show instruction cards.</noscript>
  </main>
</body>
</html>
